name: classtrack
description: "ClassTrack - School and Tuition Management App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  # State Management & Navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Backend & Supabase
  supabase_flutter: ^2.8.3

  # Local Cache & Offline storage
  shared_preferences: ^2.3.5

  # Formatting & Date/Time
  intl: ^0.20.2

  # Charts & Graphs
  fl_chart: ^0.70.2

  # Media & File Picking
  image_picker: ^1.1.2
  url_launcher: ^6.3.1

  # PDF Processing & Rendering
  syncfusion_flutter_pdf: ^28.2.9

  # On-device ML Kit OCR
  google_mlkit_text_recognition: ^0.14.0

  # Local Reminders & Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.1

  # UI Icons
  cupertino_icons: ^1.0.8
  file_picker: ^13.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
